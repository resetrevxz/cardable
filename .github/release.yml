changelog:
  exclude:
    labels: ['skip-changelog']
  categories:
    - title: Features
      labels: ['type: feature']
    - title: Fixes
      labels: ['type: bug']
    - title: Content
      labels: ['type: content', 'type: balance']
    - title: Polish
      labels: ['type: polish']
    - title: Other changes
      labels: ['*']

name: Balance and content feedback
description: Ask about odds, pack pools, card specs or collection content.
labels: ['type: content']
body:
  - type: input
    id: version
    attributes:
      label: App version and relevant pack/card
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback and evidence
      description: Include a source for hardware-spec corrections. A single rare pull does not establish changed odds.
    validations:
      required: true

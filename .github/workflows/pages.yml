name: Cardable website
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build-site.cjs', 'assets/fonts/**', 'assets/cards/**', 'assets/icons/**', 'assets/packs/**', 'assets/materials/**', 'src/**', 'package.json', 'desktop-release.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require matching published downloads
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --limit 100)
          if ! echo "$published" | jq -e --arg tag "v$version" '.[] | select(.tagName == $tag and .isDraft == false)' >/dev/null; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for published v$version downloads; keeping the last good page." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets > /tmp/cardable-release.json
          jq -e --arg exe "Cardable-Setup-$version.exe" --arg zip "Cardable-$version-Windows-x64.zip" '([.assets[] | select(.name == $exe or .name == $zip) | select(.size > 0)] | length) == 2' /tmp/cardable-release.json
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - run: node tools/build-site.cjs
        if: steps.release.outputs.ready == 'true'
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.release.outputs.ready == 'true'
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        if: steps.release.outputs.ready == 'true'
        id: deployment

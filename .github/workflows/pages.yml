name: Cardable website
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/build-site.cjs', 'assets/fonts/**', 'assets/cards/**', 'assets/icons/**', 'package.json', 'desktop-release.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/build-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - uses: actions/deploy-pages@v4
        id: deployment

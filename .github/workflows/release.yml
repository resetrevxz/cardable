name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARDABLE_RELEASE_OWNER: ${{ github.repository_owner }}
      CARDABLE_RELEASE_REPOSITORY: ${{ github.event.repository.name }}
      CARDABLE_SIGNING_MODE: ${{ vars.CARDABLE_SIGNING_MODE || 'certificate' }}
      CARDABLE_REQUIRE_SIGNING: ${{ vars.CARDABLE_REQUIRE_SIGNING || '0' }}
      CARDABLE_SIGNING_PUBLISHER: ${{ vars.CARDABLE_SIGNING_PUBLISHER }}
      CARDABLE_CERTIFICATE_SUBJECT: ${{ vars.CARDABLE_CERTIFICATE_SUBJECT }}
      CARDABLE_CERTIFICATE_SHA1: ${{ vars.CARDABLE_CERTIFICATE_SHA1 }}
      CARDABLE_SIGN_SCRIPT: ${{ vars.CARDABLE_SIGN_SCRIPT }}
      CARDABLE_AZURE_SIGNING_ENDPOINT: ${{ vars.CARDABLE_AZURE_SIGNING_ENDPOINT }}
      CARDABLE_AZURE_CERTIFICATE_PROFILE: ${{ vars.CARDABLE_AZURE_CERTIFICATE_PROFILE }}
      CARDABLE_AZURE_SIGNING_ACCOUNT: ${{ vars.CARDABLE_AZURE_SIGNING_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/check-data.js
      - run: npm run release:validate
      - name: Package complete offline installer
        run: npm run dist
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Verify signatures when signing is required
        if: env.CARDABLE_REQUIRE_SIGNING == '1'
        shell: pwsh
        run: ./tools/verify-windows-signatures.ps1
      - run: npm run release:validate -- --artifacts
      - name: Package and verify the complete Electron folder
        shell: pwsh
        run: ./tools/package-release-folder.ps1
      - name: Create checksum manifest
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json | ConvertFrom-Json).version
          $names = @("Cardable-Setup-$releaseVersion.exe", "Cardable-Setup-$releaseVersion.exe.blockmap", "Cardable-$releaseVersion-Windows-x64.zip", 'latest.yml')
          $lines = foreach ($name in $names) { "$((Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash.ToLower())  $name" }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), $lines, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: Cardable-Windows-${{ github.ref_name }}
          path: |
            dist/Cardable-Setup-*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish the validated release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assets = @("dist/Cardable-Setup-$version.exe", "dist/Cardable-Setup-$version.exe.blockmap", "dist/Cardable-$version-Windows-x64.zip", 'dist/latest.yml', 'dist/SHA256SUMS.txt')
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; preserving its assets.'; exit 0 }
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Cardable v$version" --notes-file "changelog/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy the website for the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo $env:GITHUB_REPOSITORY --ref main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

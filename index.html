<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08080A">
  <title>Cardable</title>
  <link id="favicon" rel="icon" type="image/svg+xml">
  <link rel="stylesheet" href="src/styles/tokens.css">
  <link rel="stylesheet" href="src/styles/base.css">
  <link rel="stylesheet" href="src/styles/glass.css">
  <link rel="stylesheet" href="src/styles/menu.css">
  <link rel="stylesheet" href="src/styles/card.css">
  <link rel="stylesheet" href="src/styles/finishes.css">
  <link rel="stylesheet" href="src/styles/gallery.css">
</head>
<body>
  <canvas id="dot-grid" aria-hidden="true"></canvas>
  <main class="menu-shell" aria-label="Cardable">
    <div id="wordmark" class="wordmark idle-chrome entrance" tabindex="0" role="img" aria-label="cardable" style="--entry: 0">
      <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"></svg>
    </div>
    <div class="pack-placeholder entrance" aria-hidden="true" style="--entry: 1"></div>
    <div class="currency-placeholder idle-chrome entrance" aria-label="Currency: 0" style="--entry: 2">0</div>
    <svg class="inventory-placeholder idle-chrome entrance" viewBox="0 0 24 24" aria-hidden="true" style="--entry: 2">
      <path d="M6 14l6-6 6 6"/>
    </svg>
    <div id="market-slot" hidden></div>
  </main>
  <div id="cursor-glow" class="cursor-glow idle-chrome" aria-hidden="true">
    <div class="cursor-glow__light"></div><div class="cursor-glow__ring"></div>
  </div>

  <script src="src/core/namespace.js"></script>
  <script src="src/config.js"></script>
  <script src="src/data/rarities.js"></script>
  <script src="src/data/cards.js"></script>
  <script src="src/data/packs.js"></script>
  <script src="src/core/events.js"></script>
  <script src="src/core/state.js"></script>
  <script src="src/core/timers.js"></script>
  <script src="src/core/pull.js"></script>
  <script src="src/core/serial.js"></script>
  <script src="src/core/input.js"></script>
  <script src="src/core/dev.js"></script>
  <script src="src/fx/loop.js"></script>
  <script src="src/fx/dots.js"></script>
  <script src="src/fx/cursor.js"></script>
  <script src="src/fx/springs.js"></script>
  <script src="src/finishes/index.js"></script>
  <script src="src/finishes/basic.js"></script>
  <script src="src/finishes/common.js"></script>
  <script src="src/finishes/uncommon.js"></script>
  <script src="src/finishes/rare.js"></script>
  <script src="src/finishes/super-rare.js"></script>
  <script src="src/finishes/unusual.js"></script>
  <script src="src/finishes/double-super-rare.js"></script>
  <script src="src/finishes/legendary.js"></script>
  <script src="src/finishes/mythical.js"></script>
  <script src="src/finishes/exotic.js"></script>
  <script src="src/finishes/ascendant.js"></script>
  <script src="src/finishes/secret.js"></script>
  <script src="src/finishes/limited.js"></script>
  <script src="src/ui/card-specs.js"></script>
  <script src="src/ui/card-art.js"></script>
  <script src="src/ui/card.js"></script>
  <script src="src/ui/logo.js"></script>
  <script src="src/ui/menu.js"></script>
  <script src="src/ui/gallery.js"></script>
  <script src="src/boot.js"></script>
</body>
</html>
